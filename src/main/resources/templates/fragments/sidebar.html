<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

</head>
<body>

<div class="sidebar" th:fragment="sidebarMenu(activePage)">
    <div class="sidebar-header">
        <span>Aide</span>
    </div>
   <!-- we use classappend to only activate a class under our condition that activePage == pagename -->
    <ul class="sidebar-nav">
        <li>
            <a href="/homepage" th:classappend="${activePage == 'homepage'} ? 'active' : ''">
                <i class="bi bi-house"></i>
                <span>homepage</span>
            </a>
        </li>
        <li>
            <a href="/patients" th:classappend="${activePage == 'patients'} ? 'active' : ''">
                <i class="bi bi-person"></i>
                <span>Patients</span>
            </a>
        </li>

        <li>
            <a href="/schedule" th:classappend="${activePage == 'schedule'} ? 'active' : ''">
                <i class="bi bi-clock"></i>
                <span>Schedule</span>
            </a>
        </li>
        <li>
            <a href="/inventory" th:classappend="${activePage == 'inventory'} ? 'active' : ''">
                <i class="bi bi-box-seam"></i>
                <span>Inventory</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-spacer"></div>

    <div class="user-section dropup">

        <!-- my dropdown trigger -->
        <div class="user" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer;">
            <div class="user-icon">
                <i class="bi bi-person"></i>
            </div>
            <span>Staff</span>
            <i class="bi bi-chevron-down user-chevron"></i>
        </div>


        <ul class="dropdown-menu dropdown-menu-dark shadow w-100 mb-2">
            <li><a class="dropdown-item text-danger" href="/login">Sign out</a></li>
        </ul>
    </div>
</div>
</body>
</html>
