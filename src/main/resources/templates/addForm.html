<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Opret et ønske - Ønskestjernen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container d-flex justify-content-center" style="margin-top: 65px;">

    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">

        <h2 class="text-center mb-4">Opret et ønske</h2>

        <form th:action="@{/saveWish}" th:object="${addedUserWish}" method="post">

            <div class="mb-3">

                <label for="email" class="form-label">Din email:</label>
                <input id="email" type="email" class="form-control"
                       th:field="*{email}" required>

            </div>

            <div class="mb-3">

                <label for="name" class="form-label">Ønske:</label>
                <input id="name" type="text" class="form-control"
                       th:field="*{name}">

            </div>

            <div class="mb-3">

                <label for="price" class="form-label">Pris:</label>
                <input id="price" type="number" class="form-control"
                       th:field="*{price}">

            </div>

            <div class="mb-3">

                <label class="form-label">Tags:</label>

                <div th:each="t : ${allTags}">
                    <label>
                        <input type="checkbox" th:field="*{tags}" th:value="${t}">
                        <span th:text="${t}"></span>
                    </label>
                </div>

            </div>

            <button type="submit" class="btn btn-primary">Send</button>

            <a th:href="@{/}" class="btn btn-outline-secondary">
                Tilbage til forsiden
            </a>

        </form>

    </div>

</div>
</body>

</html>
