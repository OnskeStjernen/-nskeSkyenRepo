<!DOCTYPE html>
<html lang="da" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ØnskeSkyen · Opdater ønske</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body class="bento-page-body">

<div th:replace="~{fragments/navbar :: Navbar}"></div>

<main class="bento-main-container">
    <div class="bento-card" style="max-width: 520px; margin: 0 auto;">
        <div class="bento-card-header">
            <div>
                <span class="bento-label">Redigering</span>
                <h2>Opdater ønske</h2>
            </div>
            <a th:href="@{/quickwish}" class="bento-header-link">Fortryd</a>
        </div>

        <form th:action="@{/update}" th:object="${editedWish}" method="POST">
            <input type="hidden" th:field="*{wishID}">

            <div class="mb-3">
                <label for="name" class="bento-text mb-1">Navn:</label>
                <input id="name" type="text" class="form-control" th:field="*{name}" required>
            </div>

            <div class="mb-3">
                <label for="price" class="bento-text mb-1">Pris:</label>
                <input id="price" type="number" class="form-control" th:field="*{price}" required>
            </div>

            <div class="mb-3">
                <label class="bento-text mb-1 d-block">Tags:</label>
                <div class="tag-cloud">
                    <label class="sky-tag" th:each="t : ${allTags}">
                        <input type="checkbox" th:field="*{tags}" th:value="${t}" class="me-1">
                        <span th:text="${t}"></span>
                    </label>
                </div>
            </div>

            <div class="bento-card-footer">
                <button type="submit" class="btn-bento-primary border-0">OK</button>
                <a th:href="@{/quickwish}" class="btn-bento-outline">Fortryd</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
