<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/styles.css}" rel="stylesheet">
    <title>ØnskeSkyen · Log ind</title>
</head>
<body class="bento-page-body">

<div th:replace="~{fragments/navbar :: Navbar}"></div>

<main class="bento-main-container">
    <div class="bento-card" style="max-width: 440px; margin: 0 auto;">
        <div class="bento-card-header">
            <div>
                <span class="bento-label">Konto</span>
                <h2>Log ind</h2>
            </div>
            <a th:href="@{/register}" class="bento-header-link">Opret bruger</a>
        </div>

        <!-- Error message for profileNotFoundExceptiom -->

        <div th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>

        <form action="/login" method="post" class="login-form">
            <div class="mb-3">
                <label for="loginUsername" class="bento-text mb-1">Brugernavn</label>
                <input id="loginUsername" autocomplete="username" autofocus class="form-control" name="username" placeholder="Username" type="text">
            </div>
            <div class="mb-3">
                <label for="loginEmail" class="bento-text mb-1">Email</label>
                <input id="loginEmail" autocomplete="email" class="form-control" name="email" placeholder="Email" type="email">
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="bento-text mb-1">Adgangskode</label>
                <input id="loginPassword" autocomplete="current-password" class="form-control" name="password" placeholder="Password" type="password">
            </div>

            <div class="bento-card-footer">
                <button class="login-register btn-quickwish border-0 w-100 justify-content-center" type="submit">Log In</button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
