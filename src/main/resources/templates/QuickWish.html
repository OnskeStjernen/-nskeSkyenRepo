<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ØnskeSkyen · QuickWish</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>
<main>
    <div class="mx-5 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">QuickWish</h1>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Tilbage til forsiden</a>
        </div>

        <div class="row g-4">
            <!-- Quick Add Form -->
            <div class="col-12 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="quickWishForm" th:action="@{/quickAddWish}" method="post">
                            <fieldset>
                                <legend class="h5 card-title mb-3">Tilføj hurtigt ønske</legend>
                                <div class="mb-3">
                                    <label for="wishName" class="form-label">Ønske (påkrævet)</label>
                                    <input id="wishName" name="name" type="text" class="form-control" placeholder="F.eks. Støjreducerende høretelefoner" maxlength="100" required>
                                </div>
                                <div class="mb-3">
                                    <label for="wishPrice" class="form-label">Pris i kr. (påkrævet)</label>
                                    <input id="wishPrice" name="price" type="number" min="0" inputmode="numeric" class="form-control" placeholder="F.eks. 1899" required>
                                </div>
                                <div class="mb-3">
                                    <label for="wishTags" class="form-label">Tags / Link (valgfri)</label>
                                    <input id="wishTags" name="tags" type="text" class="form-control" placeholder="F.eks. Elektronik">
                                </div>
                                <button id="quickWishSubmitBtn" type="submit" class="btn btn-primary w-100">Tilføj ønske</button>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Wishes Table -->
            <div class="col-12 col-lg-7">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col" class="w-50">Wish</th>
                        <th scope="col" class="w-25">Price</th>
                        <th scope="col" class="w-25">Link</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${wishes}">
                        <td class="fw-bold">
                            <a th:text="${item.name}">Tivoli</a>
                        </td>
                        <td th:text="${item.price + ' kr.'}">0 kr.</td>
                        <td class="text-muted">
                            <a class="linking" th:text="${item.tags}">Forlystelsespark i København</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script>
    const quickWishForm = document.getElementById('quickWishForm');
    const quickWishSubmitBtn = document.getElementById('quickWishSubmitBtn');
    if (quickWishForm && quickWishSubmitBtn) {
        quickWishForm.addEventListener('submit', () => {
            if (quickWishForm.checkValidity()) {
                quickWishSubmitBtn.disabled = true;
            }
        });
    }
</script>
</body>
</html>
