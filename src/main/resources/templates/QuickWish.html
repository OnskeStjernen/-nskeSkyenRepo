<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ØnskeSkyen · QuickWish</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/styles.css}" rel="stylesheet">
</head>
<body>
<main>
    <div class="mx-5 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">QuickWish</h1>
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Tilbage til forsiden</a>
        </div>

        <div class="row g-4">
            <!-- Quick Add Form -->
            <div class="col-12 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="quickWishForm" th:action="@{/quickAddWish}" method="post">
                            <fieldset>
                                <legend class="h5 card-title mb-3">Tilføj hurtigt ønske</legend>
                                <div class="mb-3">
                                    <label for="wishName" class="form-label">Ønske (påkrævet)</label>
                                    <input id="wishName" name="name" type="text" class="form-control" placeholder="F.eks. Støjreducerende høretelefoner" maxlength="100" required>
                                </div>
                                <div class="mb-3">
                                    <label for="wishPrice" class="form-label">Pris i kr. (påkrævet)</label>
                                    <input id="wishPrice" name="price" type="number" min="0" inputmode="numeric" class="form-control" placeholder="F.eks. 1899" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Tags:</label>
                                    <div th:each="t : ${allTags}">
                                        <label>
                                            <input type="checkbox" name="tags" th:value="${t}">
                                            <span th:text="${t}"></span>
                                        </label>
                                    </div>
                                </div>
                                <button id="quickWishSubmitBtn" type="submit" class="btn btn-primary w-100">Tilføj ønske</button>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Share Form (Hidden unless logged in) -->
            <div class="col-12 col-lg-5" th:if="${isLoggedIn}">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="quickShareForm" th:action="@{/quickShareWish}" method="post">
                            <fieldset>
                                <legend class="h5 card-title mb-3">Share et eller flere ønsker</legend>
                                <div class="mb-3">
                                    <label for="ShareName" class="form-label">Ønske (påkrævet)</label>
                                    <input id="ShareName" name="name" type="text" class="form-control" placeholder="F.eks. Støjreducerende høretelefoner" maxlength="100" required>
                                </div>
                                <div class="mb-3">
                                    <label for="SharePrice" class="form-label">Pris i kr. (påkrævet)</label>
                                    <input id="SharePrice" name="price" type="number" min="0" inputmode="numeric" class="form-control" placeholder="F.eks. 1899" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Tags:</label>
                                    <div th:each="t : ${allTags}">
                                        <label>
                                            <input type="checkbox" name="tags" th:value="${t}">
                                            <span th:text="${t}"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="Email" class="form-label">Email of reciver</label>
                                    <input id="Email" name="email" type="email" class="form-control" placeholder="F.eks. xxxx@gmail.com" required>
                                </div>
                                <button id="quickShareSubmitBtn" type="submit" class="btn btn-primary w-100">Share ønske</button>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Wishes Table -->
            <div class="col-12 col-lg-7">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col">Wish</th>
                        <th scope="col">Price</th>
                        <th scope="col">Tags</th>
                        <th scope="col" th:if="${isLoggedIn}" colspan="2">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${wishes}">
                        <td class="fw-bold">
                            <a th:text="${item.name}">Tivoli</a>
                        </td>
                        <td th:text="${item.price + ' kr.'}">0 kr.</td>
                        <td class="text-muted">
                            <a class="linking" th:text="${item.tags}">Forlystelsespark i København</a>
                        </td>
                        <td th:if="${isLoggedIn}">
                            <a th:href="@{/{wishID}/edit(wishID=${item.wishID})}" class="btn btn-sm btn-outline-primary">Opdater</a>
                        </td>
                        <td th:if="${isLoggedIn}">
                            <form th:action="@{/{wishID}/deleteWish(wishID=${item.wishID})}" method="POST" onsubmit="return confirm('Er du sikker på du vil slette dit ønske?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Slet</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</main>
<script>
    const quickWishForm = document.getElementById('quickWishForm');
    const quickWishSubmitBtn = document.getElementById('quickWishSubmitBtn');
    if (quickWishForm && quickWishSubmitBtn) {
        quickWishForm.addEventListener('submit', () => {
            if (quickWishForm.checkValidity()) {
                quickWishSubmitBtn.disabled = true;
            }
        });
    }
</script>
</body>
</html>
