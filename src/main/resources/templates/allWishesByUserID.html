<!DOCTYPE html>
<html lang="en"
xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>allWishesByUserID</title>
</head>
<body>

<h1> Alle Ønsker</h1>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Tags</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="wish : ${allWishes}">
        <td th:text="${wish.name}"></td>
        <td th:text="${wish.price}"></td>
        <td th:text="${wish.tags}"></td>
        <td>
            <a th:href="@{/{wishID}/edit(wishID=${wish.wishID})}">Opdater</a>
        </td>
        <td>
            <form th:action="@{/{wishID}/deleteWish (wishID=${wish.wishID})}" method="POST" onsubmit="return confirm('Er du sikker på du vil slette dit ønske?')">
                <button type="submit"> Slet</button>
            </form>
        </td>

    </tr>
    </tbody>

</table>
<br>

<a th:href="@{/addWish}"> Tilføj ønske</a>

</body>
</html>
